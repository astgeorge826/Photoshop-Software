-columns:1fr 1fr;gap:10px}.option{min-height:65px;text-align:left}.option.correct{border-color:var(--good);background:#1d564a}.option.incorrect{border-color:var(--bad);background:#61313e}.feedback{margin-top:18px;padding:15px;border-radius:12px;background:#213a50;border-left:4px solid var(--accent)}.feedback.good{border-color:var(--good)}.feedback.bad{border-color:var(--bad)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.primary{background:#0c87b9;color:white;border-color:#42c4f5;font-weight:750}.tag{display:inline-block;background:#28475e;border-radius:7px;padding:4px 9px;color:#c4e7fb;font-size:.82rem}.hidden{display:none!important}.note{border:1px dashed #577995;border-radius:12px;padding:13px;margin-top:17px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.topic{padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}.topic h3{margin:0 0 6px}.topic p{margin:0 0 12px;color:var(--muted);font-size:.92rem}.topic button{width:100%}.small{font-size:.9rem}.results{font-size:3.3rem;font-weight:800;color:var(--accent)}.badge{display:inline-block;border-radius:50px;padding:5px 10px;background:#25516a;color:#dcf6ff}.toolicon{display:inline-grid;place-items:center;width:82px;height:82px;background:#30363e;border:1px solid #74808c;border-radius:7px;font-size:34px;margin:0 0 8px}@media(max-width:760px){.layout{grid-template-columns:1fr}.options,.grid{grid-template-columns:1fr}.sidebar .nav{display:grid;grid-template-columns:1fr 1fr}.panel{padding:17px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><header><div><div class="eyebrow">Year 10 · Image Manipulation</div><h1>Photoshop Knowledge Challenge</h1><div class="sub">Learn it. Apply it to your poster. Remember it for your assessment.</div></div></header><div class="layout"><aside class="panel sidebar"><h2>Choose an activity</h2><div class="nav" id="nav"><button data-view="home" class="active">🏠 Dashboard</button><button data-view="quick">⚡ Quick-fire: 5 questions</button><button data-view="scenario">🎨 Poster decisions</button><button data-view="tools">🛠 Tool recognition</button><button data-view="topics">📚 Revise by topic</button><button data-view="exam">🏁 Final assessment</button></div><div style="margin-top:22px"><div class="stat"><span>Practice correct</span><strong id="correctStat">0</strong></div><div class="stat"><span>Questions tried</span><strong id="triedStat">0</strong></div><div class="stat"><span>Best assessment</span><strong id="bestStat">—</strong></div><div class="progress"><div id="overallBar" style="width:0%"></div></div><button id="reset" class="small">Reset my progress</button></div></aside><section class="panel" id="content" aria-live="polite"></section></div></main><script>

=[b[j],b[i]]}return b}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showHome(){mode='home';setActive('home');$('#content').innerHTML='<div class="eyebrow">Your learning hub</div><h2>Build your knowledge while building your poster</h2><p class="muted">Take a five-question break, practise decisions you might make in Photoshop, or prepare for the knowledge assessment. Each activity uses the content of your knowledge organiser.</p><div class="grid"><div class="topic"><h3>⚡ Quick-fire</h3><p>Five random questions. Ideal for a short break from poster work.</p><button data-start="quick">Start quick-fire →</button></div><div class="topic"><h3>🎨 Poster decisions</h3><p>Apply the organiser to common poster-editing situations.</p><button data-start="scenario">Try poster scenarios →</button></div><div class="topic"><h3>🛠 Tool recognition</h3><p>Recognise the tool icons shown in your knowledge organiser.</p><button data-start="tools">Practise tools →</button></div><div class="topic"><h3>🏁 Final assessment</h3><p>20 questions across all eight topics. See your score and review at the end.</p><button data-start="exam">Take assessment →</button></div></div><div class="note">Suggested routine: Work on your poster for 10–15 minutes → complete a quick-fire challenge → return to Photoshop. Use topic revision for anything you get wrong.</div>';bindStarts()}
function showTopics(){mode='topics';setActive('topics');$('#content').innerHTML='<div class="eyebrow">Targeted revision</div><h2>Choose a knowledge organiser topic</h2><p class="muted">Practise the exact terminology from the organiser.</p><div class="grid">'+TOPICS.map((t,i)=>'<div class="topic"><h3>'+ (i+1)+'. '+escapeHtml(t)+'</h3><p>'+Q.filter(q=>q[0]===t).length+' questions available</p><button data-topic="'+escapeHtml(t)+'">Practise this topic →</button></div>').join('')+'</div>';document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start('topic',b.dataset.topic))}
function setActive(v){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}function bindStarts(){document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start))}
function start(m,t=''){mode=m;topic=t;setActive(m==='topic'?'topics':m);questions=(m==='quick'?shuffle(Q).slice(0,5):m==='scenario'?shuffle(S).slice(0,10):m==='tools'?shuffle(T):m==='topic'?shuffle(Q.filter(q=>q[0]===t)):shuffle(Q).slice(0,20)).map(q=>m==='scenario'?[q[0],null,q[1],q[2],q[3],null,'Poster scenario']:m==='tools'?[q[0],q[1],q[2],q[3],q[4],null,'Tool recognition']:[q[1],null,q[2],q[3],q[4],null,q[0]]);index=0;score=0;answered=false;selected=-1;renderQuestion()}
function renderQuestion(){if(index>=questions.length){finish();return}let q=questions[index],isExam=mode==='exam',label=mode==='quick'?'Quick-fire':mode==='scenario'?'Poster decisions':mode==='tools'?'Tool recognition':mode==='topic'?topic:'Final assessment';$('#content').innerHTML='<div class="eyebrow">'+escapeHtml(label)+'</div><div class="stat"><span>Question '+(index+1)+' of '+questions.length+'</span><strong>'+(isExam?'Answers checked at end':score+' correct')+'</strong></div><div class="progress"><div style="width:'+(100*index/questions.length)+'%"></div></div><span class="tag">'+escapeHtml(q[6])+'</span><div class="question">'+escapeHtml(q[0])+'</div>'+(mode==='tools'?'<div class="toolicon" aria-label="Photoshop tool icon"><img alt="Photoshop tool icon" src="'+TOOL_IMAGES[q[1]]+'" style="width:64px;height:64px;object-fit:contain"></div>':'')+'<div class="options">'+(mode==='tools'?q[2]:q[2]).map((o,i)=>'<button class="option" data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+escapeHtml(o)+'</button>').join('')+'</div><div id="feedback" class="hidden"></div><div class="actions"><button class="primary hidden" id="next">'+(index===questions.length-1?'See results →':'Next question →')+'</button><button id="quit">Exit activity</button></div>';document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.answer)));$('#next').onclick=next;$('#quit').onclick=showHome}
function choose(i){if(answered)return;answered=true;selected=i;let q=questions[index],right=q[3],isCorrect=i===right;if(isCorrect)score++;if(mode!=='exam'){stats.tried++;if(isCorrect)stats.correct++;persist()}document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(mode!=='exam'){if(Number(b.dataset.answer)===right)b.classList.add('correct');else if(Number(b.dataset.answer)===i)b.classList.add('incorrect')}});let f=$('#feedback');if(mode!=='exam'){f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML='<strong>'+(isCorrect?'✓ Correct!':'Not quite. The correct answer is '+escapeHtml(q[2][right])+'.')+'</strong><div>'+escapeHtml(q[4])+'</div>'}else{f.className='feedback';f.textContent='Answer recorded. Feedback will appear at the end.'}$('#next').classList.remove('hidden');if(mode==='exam'){questions[index][5]=i}}
function next(){index++;answered=false;selected=-1;renderQuestion()}
function finish(){let pct=Math.round(100*score/questions.length),isExam=mode==='exam';if(isExam){stats.best=Math.max(stats.best===null?0:stats.best,pct);stats.tried+=questions.length;stats.correct+=score;persist()}let review=isExam?questions.map((q,i)=>({q,i})).filter(x=>x.q[5]!==x.q[3]):[];$('#content').innerHTML='<div class="eyebrow">Challenge complete</div><h2>'+(pct>=80?'Excellent recall!':pct>=60?'Good progress — keep practising!':'Keep going — every attempt helps!')+'</h2><div class="results">'+score+' / '+questions.length+'</div><p><span class="badge">'+pct+'% correct</span></p><p class="muted">'+(isExam?'Your assessment answers are now marked.':'Your answers were checked as you went.')+'</p>'+(review.length?'<h2>Review these questions</h2>'+review.map(({q,i})=>'<div class="topic" style="margin:10px 0"><strong>'+(i+1)+'. '+escapeHtml(q[0])+'</strong><p>Your answer: '+escapeHtml(q[2][q[5]])+'</p><p>Correct answer: <strong>'+escapeHtml(q[2][q[3]])+'</strong></p><p>'+escapeHtml(q[4])+'</p></div>').join(''):isExam?'<div class="feedback good">All 20 answers correct — well done!</div>':'')+'<div class="actions"><button class="primary" id="again">Try again ↻</button><button id="topicsBtn">Revise a topic</button><button id="homeBtn">Dashboard</button></div>';$('#again').onclick=()=>start(mode,topic);$('#topicsBtn').onclick=showTopics;$('#homeBtn').onclick=showHome}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{let v=b.dataset.view;if(v==='home')showHome();else if(v==='topics')showTopics();else start(v)});$('#reset').onclick=()=>{if(confirm('Reset your saved practice scores and best assessment result?')){stats={correct:0,tried:0,best:null};persist();showHome()}};updateStats();showHome();
</script></body></html>
